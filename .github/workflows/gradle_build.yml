name: Build OSCAR-Viewer

on:
  push:
    branches: [ main, dev, cicd ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: viewer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build, audit, lint, and component suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install oscar-viewer dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm run audit:dependencies

      - name: Validate dependency policy and locale catalogs
        run: |
          npm run validate:dependencies
          npm run validate:locales

      - name: Check TypeScript
        run: npm run lint

      - name: Build oscar-viewer
        run: npm run build

      - name: Install Cypress
        run: npx cypress install

      - name: Run the complete component regression suite
        run: npm run test:component
